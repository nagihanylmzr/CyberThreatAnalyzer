<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Threat Analyzer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            margin:0;
            background:#252a32;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        .wrapper{
            display:flex;
            min-height:100vh;
        }

        /* =========================
           Sidebar
        ========================== */

        .sidebar{
            width:280px;
            background:#111418;
            padding:35px 25px;
            flex-shrink:0;
            border-right:1px solid #2d3742;
        }

        .logo{
            font-size:30px;
            font-weight:700;
            margin-bottom:50px;
            color:white;
        }

        .sidebar-link{

            display:flex;
            align-items:center;
            gap:14px;

            padding:14px 16px;
            margin-bottom:10px;

            border-radius:12px;

            color:#c7ced8;
            text-decoration:none;

            transition:all .25s ease;

            font-size:17px;
            font-weight:500;

        }

        .sidebar-link:hover{

            background:#1f2731;
            color:white;
            transform:translateX(6px);

        }
.sidebar-link.active{

    background:#2563eb;

    color:white;

    font-weight:600;

    box-shadow:0 0 15px rgba(37,99,235,.35);

}
.sidebar-link.active i{
    color:white;
}
        .sidebar-link i{

            width:24px;
            text-align:center;
            font-size:18px;

        }

        .footer{

            margin-top:70px;
            border-top:1px solid #2d3742;
            padding-top:20px;
            color:#9ea4ad;
            font-size:14px;

        }
/* =========================
   Top Navigation
========================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:35px;

    padding-bottom:20px;

    border-bottom:1px solid #2d3742;

}

.topbar-icons{

    display:flex;

    gap:20px;

    font-size:22px;

}

.topbar-icons i{

    cursor:pointer;

    transition:.25s;

    color:#c7ced8;

}

.topbar-icons i:hover{

    color:#3f78ff;

    transform:scale(1.15);

}
        /* =========================
           Content
        ========================== */

        .content{

            flex:1;
            padding:40px 50px;
            background:#252a32;

        }

        /* =========================
           Cards
        ========================== */
.card h1{
    color:white;
    font-weight:700;
}

.card h5{
    color:#d7dde5;
    font-weight:600;
}

.card p{
    color:#cfd6df;
}

.card-body{
    color:white;
}
        .card{

            background:#1b2129;
            border:1px solid #2d3742;
            border-radius:18px;

            transition:all .3s ease;

            overflow:hidden;

            box-shadow:0 5px 15px rgba(0,0,0,.20);

        }

        .card:hover{

            transform:translateY(-6px);

            box-shadow:0 15px 35px rgba(0,0,0,.45);

            border-color:#3f78ff;

        }

        .card-header{

            background:#151a20 !important;

            color:white !important;

            border-bottom:1px solid #2d3742;

            font-weight:600;

        }

        .card-body{

            background:#1b2129;

        }
.card-primary{
    border-top:4px solid #0d6efd;
}
.card-body{
    background:#1b2129;
    padding:24px;
}

.card-success{
    border-top:4px solid #198754;
}

.card-danger{
    border-top:4px solid #dc3545;
}

.card-warning{
    border-top:4px solid #fd7e14;
}
        .display-4,
        .display-5{

            font-weight:700;

        }

        .badge{

            font-size:.85rem;

        }

        .table{

            color:white;

        }

        .list-group-item{

            background:#1b2129;
            color:white;
            border-color:#2d3742;

        }

    </style>

</head>

<body>

<div class="wrapper">

 <!-- Sidebar -->

<div class="sidebar">

    <!-- Logo -->
    <div class="logo">
        🛡 CTA
    </div>

    <!-- Navigation -->

    <a href="/"
       class="sidebar-link {% if active_page == 'dashboard' %}active{% endif %}">
        <i class="bi bi-speedometer2"></i>
        <span>Dashboard</span>
    </a>

    <a href="/companies"
       class="sidebar-link {% if active_page == 'companies' %}active{% endif %}">
        <i class="bi bi-buildings"></i>
        <span>Companies</span>
    </a>

    <a href="/cves"
       class="sidebar-link {% if active_page == 'cves' %}active{% endif %}">
        <i class="bi bi-shield-lock"></i>
        <span>CVEs</span>
    </a>

    <a href="/articles"
       class="sidebar-link {% if active_page == 'articles' %}active{% endif %}">
        <i class="bi bi-newspaper"></i>
        <span>Articles</span>
    </a>

    <hr class="my-4" style="border-color:#2d3742;">

    <a href="/admin"
       class="sidebar-link {% if active_page == 'admin' %}active{% endif %}">
        <i class="bi bi-gear-fill"></i>
        <span>Admin Panel</span>
    </a>

    <!-- Footer -->

    <div class="footer">

        <p class="mb-1 fw-bold">
            Cyber Threat Analyzer
        </p>

        <p class="mb-0">
            Version 1.0
        </p>

    </div>

</div>

<!-- Content -->

<div class="content">

    <!-- Top Navigation -->

    <div class="topbar">

        <div>

            <h4 class="mb-1 fw-bold">
                Cyber Threat Analyzer
            </h4>

            <small class="text-secondary">
                Real-time Cyber Threat Intelligence Platform
            </small>

        </div>

        <div class="topbar-icons">

            <i class="bi bi-search"></i>

            <i class="bi bi-bell"></i>

            <i class="bi bi-person-circle"></i>

        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}
{% endblock %}

</body>
</html>
